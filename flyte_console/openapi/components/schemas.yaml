SuccessEnvelope:
  type: object
  required: [status, data]
  properties:
    status:
      type: integer
      example: 200
    data: {}
ErrorEnvelope:
  type: object
  required: [status, message]
  properties:
    status:
      type: integer
      example: 400
    message:
      type: string
      example: id is required
InstanceRunRequest:
  type: object
  required: [project, domain]
  properties:
    org: { type: string, description: External source organization. }
    project: { type: string }
    domain: { type: string }
    id: { type: string }
    name: { type: string }
    imageType: { type: string, enum: [BASE, OWN] }
    image: { type: string }
    baseImage:
      type: object
      properties:
        image: { type: string }
    enableSsh: { type: boolean }
    authorizedKey: { type: string }
    resourceDefinition:
      type: object
      properties:
        cpu: { type: string }
        memory: { type: string }
        gpu: { type: integer, minimum: 0 }
        gpu_key: { type: string }
TaskRunRequest:
  type: object
  required: [project, domain, id, name]
  properties:
    org: { type: string }
    project: { type: string }
    domain: { type: string }
    id: { type: string }
    name: { type: string }
    image: { type: string }
    command:
      type: array
      items: { type: string }
    resourceDefinition: { type: object }
ModelRunRequest:
  type: object
  required: [project, domain, id]
  properties:
    org: { type: string }
    project: { type: string }
    domain: { type: string }
    id: { type: string, description: Unique model identifier. }
    name: { type: string }
    code: { type: string }
    profile: { type: string, enum: [VLLM] }
    resourceDefinition: { type: object }
