get:
  operationId: getAioneResourceStatus
  tags: [Execution management]
  summary: Get an instance, training-task, or model-application status
  security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
  parameters:
    - $ref: ../aione.yaml#/components/parameters/managedType
    - $ref: ../aione.yaml#/components/parameters/id
  responses:
    "200":
      description: Current execution status.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../aione.yaml#/components/schemas/SuccessEnvelope
              - $ref: ../aione.yaml#/components/schemas/ModelStatusEnvelope
          example:
            {
              status: 200,
              data:
                {
                  runId: aione/aione/development/train-01,
                  phase: 4,
                  error: "",
                  durationSeconds: 120,
                },
            }
    "400": { $ref: ../aione.yaml#/components/responses/BadRequest }
    "401": { $ref: ../aione.yaml#/components/responses/Unauthorized }
    "404": { $ref: ../aione.yaml#/components/responses/NotFound }
    "502": { $ref: ../aione.yaml#/components/responses/UpstreamFailure }
