post:
  operationId: getModelApiKey
  tags: [Models]
  summary: Model API key migration tombstone
  description: API key creation has moved to the aione-api deployment publication page.
  security: [{ apiKeyAuth: [] }]
  parameters:
    - $ref: ../aione.yaml#/components/parameters/modelCode
  responses:
    "410":
      description: API key creation has moved to aione-api.
      content:
        application/json:
          schema: { $ref: ../aione.yaml#/components/schemas/ErrorEnvelope }
          example:
            {
              status: 410,
              message: "model API key creation moved to https://aione.example/models/deployments",
            }
    "401": { $ref: ../aione.yaml#/components/responses/Unauthorized }
    "502": { $ref: ../aione.yaml#/components/responses/UpstreamFailure }
