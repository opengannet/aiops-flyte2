post:
  operationId: getModelApiKey
  tags: [Models]
  summary: Get a model API key
  description: This route does not use AIONE external API-key authentication.
  security: []
  parameters:
    - $ref: ../aione.yaml#/components/parameters/modelCode
  responses:
    '200':
      description: A model invocation API key.
      content:
        application/json:
          schema: { $ref: ../aione.yaml#/components/schemas/SuccessEnvelope }
          example: { status: 200, data: sk-example }
    '400': { $ref: ../aione.yaml#/components/responses/BadRequest }
    '502': { $ref: ../aione.yaml#/components/responses/UpstreamFailure }
