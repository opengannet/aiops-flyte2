post:
  operationId: startModelApplication
  tags: [Runs]
  summary: Start a model application by model ID
  description: The path model ID is applied to the request. A body id, when present, must match it. This operation creates compute resources.
  security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
  parameters:
    - $ref: ../aione.yaml#/components/parameters/id
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../aione.yaml#/components/schemas/ModelRunRequest }
  responses:
    '200':
      description: The model application was created.
      content:
        application/json:
          schema: { $ref: ../aione.yaml#/components/schemas/SuccessEnvelope }
          example: { status: 200, data: { name: qwen-app, code: qwen, profile: VLLM, url: https://qwen.example } }
    '400': { $ref: ../aione.yaml#/components/responses/BadRequest }
    '401': { $ref: ../aione.yaml#/components/responses/Unauthorized }
    '409': { $ref: ../aione.yaml#/components/responses/Conflict }
    '502': { $ref: ../aione.yaml#/components/responses/UpstreamFailure }
