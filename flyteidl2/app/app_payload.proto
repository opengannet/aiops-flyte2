syntax = "proto3";

package flyteidl2.app;

import "buf/validate/validate.proto";
import "flyteidl2/aione/cloudstorage/cloud_storage_definition.proto";
import "flyteidl2/app/app_definition.proto";
import "flyteidl2/common/identifier.proto";
import "flyteidl2/common/list.proto";

option go_package = "github.com/flyteorg/flyte/v2/gen/go/flyteidl2/app";

// Request message for creating an app.
message CreateRequest {
  // The app to be created.
  App app = 1 [(buf.validate.field).required = true];
}

// Request message for creating an OpenAI-compatible model app.
message CreateModelAppRequest {
  ModelAppInput model = 1 [(buf.validate.field).required = true];
}

// Input for creating an OpenAI-compatible model app backed by Flyte Apps.
message ModelAppInput {
  string org = 1;
  string project = 2 [(buf.validate.field).string.min_len = 1];
  string domain = 3 [(buf.validate.field).string.min_len = 1];
  string name = 4;
  string id = 5;
  string code = 6;
  string image = 7;
  string param = 8;
  repeated ModelCodeSource codes = 9;
  ModelResourceDefinition resource_definition = 10;
  repeated aione.cloudstorage.CloudStorageMount cloud_storage_mounts = 11;
  string model_cache_size = 12;
}

// ModelCodeSource describes a repository or archive source for model files.
message ModelCodeSource {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string branch = 2;
  string path = 3;
  string token = 4;
}

// ModelResourceDefinition describes resources requested by a model app.
message ModelResourceDefinition {
  string cpu = 1;
  string memory = 2;
  uint32 gpu = 3;
  // gpu_key is the Kubernetes extended resource name, for example nvidia.com/gpu.
  string gpu_key = 4;
  // gpu_node_label_key selects nodes advertising the requested GPU model, for example nvidia.com/t4=true.
  string gpu_node_label_key = 5;
}

// Redacted repository source metadata shown when editing a model app.
message ModelCodeSourceView {
  string id = 1;
  string branch = 2;
  string path = 3;
  bool token_configured = 4;
}

// ModelCachePVC describes the automatically managed model-cache volume.
message ModelCachePVC {
  string name = 1;
  string storage_class_name = 2;
  string requested_size = 3;
  string capacity = 4;
  bool expandable = 5;
}

// Editable model-app configuration plus immutable, redacted source metadata.
message ModelAppConfig {
  Identifier app_id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string code = 3;
  string image = 4;
  string param = 5;
  repeated ModelCodeSourceView codes = 6;
  ModelResourceDefinition resource_definition = 7;
  repeated aione.cloudstorage.CloudStorageMount cloud_storage_mounts = 8;
  ModelCachePVC model_cache_pvc = 9;
}

message GetModelAppConfigRequest {
  Identifier app_id = 1 [(buf.validate.field).required = true];
}

message GetModelAppConfigResponse {
  ModelAppConfig model = 1;
}

// Only runtime fields are accepted; identity and model source remain immutable.
message UpdateModelAppRequest {
  Identifier app_id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string image = 3;
  string param = 4;
  ModelResourceDefinition resource_definition = 5;
  repeated aione.cloudstorage.CloudStorageMount cloud_storage_mounts = 6;
  string reason = 7 [(buf.validate.field).string.max_len = 100];
  string model_cache_size = 8;
}

message UpdateModelAppResponse {
  App app = 1;
}

// Response message for creating an app.
message CreateResponse {
  // The created app.
  App app = 1;
}

// Request message for retrieving an app.
message GetRequest {
  oneof identifier {
    option (buf.validate.oneof).required = true;

    // Identifier of the app to be retrieved.
    Identifier app_id = 1;

    // Ingress of the app to be retrieved. Only one field need to be set.
    // If multiple fields are set, they must resolve into the same app.
    // Otherwise, an error is returned.
    Ingress ingress = 2;
  }
}

// Response message for retrieving an app.
message GetResponse {
  // The retrieved app.
  App app = 1;
}

// Request message for updating an app.
message UpdateRequest {
  // The app to be updated.
  App app = 1 [(buf.validate.field).required = true];
  string reason = 2 [(buf.validate.field).string.max_len = 100];
}

// Response message for updating an app.
message UpdateResponse {
  // The updated app.
  App app = 1;
}

// Request message for deleting an app.
message DeleteRequest {
  // Identifier of the app to be deleted.
  Identifier app_id = 1 [(buf.validate.field).required = true];
}

// Response message for deleting an app.
message DeleteResponse {}

// Filter for apps whose spec inputs reference the given artifact.
// The artifact org is taken from the caller's organization.
message ConsumedArtifactFilter {
  // Project of the artifact.
  string project = 1 [(buf.validate.field).string.min_len = 1];
  // Domain of the artifact.
  string domain = 2 [(buf.validate.field).string.min_len = 1];
  // Name of the artifact.
  string name = 3 [(buf.validate.field).string.min_len = 1];
  // Exact artifact version. Empty matches any version.
  string version = 4;
}

// Request message for listing apps.
message ListRequest {
  // Common list request parameters.
  common.ListRequest request = 1;

  oneof filter_by {
    option (buf.validate.oneof).required = true;

    // Organization name for filtering apps.
    string org = 2 [(buf.validate.field).string.min_len = 1];
    // Cluster identifier for filtering apps.
    common.ClusterIdentifier cluster_id = 3;
    // Project identifier for filtering apps.
    common.ProjectIdentifier project = 4;
    // Apps consuming the given artifact as an input.
    ConsumedArtifactFilter artifact = 7;
  }

  // Disable caller identity enrichment in the response.
  bool disable_identity_enrichment = 5;

  // Include the total number of apps matching the request's filters in the response.
  // May be set on any request, including any page of a paginated listing. The count
  // reflects state at the time the request is served and may change between pages, so
  // a client that needs an up-to-date total can request it again on a later page.
  // This performs an additional count query, so leave it unset when the total is not
  // needed.
  bool include_total_count = 6;
}

// Response message for listing apps.
message ListResponse {
  // List of apps.
  repeated App apps = 1;
  // Token for fetching the next page of results, if any.
  string token = 2;
  // Total number of apps matching the request's filters, ignoring pagination.
  // Only populated when include_total_count is set on the request.
  int64 total_count = 3;
}

// Request message for watching app events.
message WatchRequest {
  oneof target {
    option (buf.validate.oneof).required = true;

    // Organization name for filtering events.
    string org = 1 [(buf.validate.field).string.min_len = 1];
    // Cluster identifier for filtering events.
    common.ClusterIdentifier cluster_id = 2;
    // Project identifier for filtering events.
    common.ProjectIdentifier project = 3;
    // App identifier for filtering events.
    Identifier app_id = 4;
  }
}

// Event message for app creation.
message CreateEvent {
  // The created app.
  App app = 1;
}

// Event message for app update.
message UpdateEvent {
  // The updated app.
  App updated_app = 1;
  // The old app before the update.
  App old_app = 2;
}

// Event message for app deletion.
message DeleteEvent {
  // The deleted app.
  App app = 1;
}

// Response message for watching app events.
message WatchResponse {
  oneof event {
    // Event for app creation.
    CreateEvent create_event = 1;
    // Event for app update.
    UpdateEvent update_event = 2;
    // Event for app deletion.
    DeleteEvent delete_event = 3;
  }
}

// Request message for updating app status.
message UpdateStatusRequest {
  // The app with updated status.
  App app = 1 [(buf.validate.field).required = true];
}

// Response message for updating app status.
message UpdateStatusResponse {
  // The app with updated status.
  App app = 1;
}

// Request message for leasing apps.
message LeaseRequest {
  // Cluster identifier for leasing apps.
  common.ClusterIdentifier id = 1 [(buf.validate.field).required = true];
}

// Response message for leasing apps.
message LeaseResponse {
  // List of leased apps.
  repeated App apps = 1;
}
